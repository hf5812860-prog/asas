<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مفكك Luraph AI</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --line:#30363d; --fg:#c9d1d9;
  --dim:#8b949e; --blue:#58a6ff; --green:#238636; --red:#f85149;
  --amber:#9e6a03; --purple:#a371f7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:14px;color:var(--blue)}
header .key{display:flex;gap:6px}
input,button,textarea{font:inherit;color:var(--fg)}
input,textarea{background:var(--bg);border:1px solid var(--line);
  border-radius:4px;padding:6px 10px;outline:none}
input:focus,textarea:focus{border-color:var(--blue)}
button{background:#21262d;border:1px solid var(--line);border-radius:4px;
  padding:6px 14px;cursor:pointer;transition:.15s}
button:hover{background:var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
button.primary:hover{background:#2ea043}
main{display:flex;flex:1;min-height:0}
aside{width:340px;border-left:1px solid var(--line);display:flex;
  flex-direction:column;min-height:0}
aside .up{padding:12px;border-bottom:1px solid var(--line)}
aside .up button{width:100%;padding:12px}
aside .list{flex:1;overflow-y:auto;padding:8px}
aside .list .empty{color:#484f58;font-size:12px;padding:12px;text-align:center}
.job{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:4px;
  border:1px solid transparent;transition:.15s}
.job:hover{background:var(--bg2)}
.job.sel{background:#1f2937;border-color:var(--blue)}
.job .name{font-size:12px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.job .meta{display:flex;gap:8px;font-size:11px;color:var(--dim);margin-top:4px}
.badge{padding:1px 6px;border-radius:3px;font-size:10px;text-transform:uppercase}
.badge.queued{background:var(--line)}
.badge.running{background:var(--amber);color:#fff}
.badge.done{background:var(--green);color:#fff}
.badge.failed{background:var(--red);color:#fff}
section.view{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2);
  overflow-x:auto}
.tab{padding:9px 16px;cursor:pointer;color:var(--dim);font-size:12px;
  white-space:nowrap;border-bottom:2px solid transparent;transition:.15s}
.tab.on{color:var(--blue);border-color:var(--blue)}
.tab:hover{color:var(--fg)}
.pane{flex:1;overflow:auto;padding:0}
.empty{flex:1;display:flex;align-items:center;justify-content:center;
  color:#484f58;font-style:italic;font-size:14px}
.progress-wrap{padding:32px;max-width:600px}
.progress-wrap h2{color:var(--blue);margin:0 0 16px}
.bar{height:6px;background:#21262d;border-radius:3px;overflow:hidden;
  margin:16px 0 8px}
.bar>i{display:block;height:100%;background:var(--green);
  transition:width .3s}
.stage{color:var(--dim);font-size:12px}
.err{color:var(--red);margin-top:16px;white-space:pre-wrap;font-size:12px}
.code{display:flex;font-size:12px;line-height:1.5;margin:0}
.code .ln{color:#484f58;user-select:none;text-align:left;padding:12px 12px;
  flex-shrink:0;border-left:1px solid var(--line);background:#0a0d12}
.code .src{padding:12px;white-space:pre;flex:1;overflow-x:auto}
.stats{display:flex;gap:24px;padding:16px;background:var(--bg2);
  border-bottom:1px solid var(--line);font-size:12px}
.stats b{color:var(--blue)}
.sec{padding:16px 24px;max-width:1000px}
.sec h3{font-size:12px;color:var(--blue);text-transform:uppercase;
  margin:0 0 10px;letter-spacing:.5px}
.sec table{width:100%;font-size:12px;border-collapse:collapse}
.sec td{padding:5px 8px;border-bottom:1px solid #21262d;vertical-align:top}
.sec td:first-child{color:#79c0ff;font-family:ui-monospace;width:40%;
  word-break:break-all}
.sec td:last-child{color:var(--dim);word-break:break-all}
.chat{display:flex;flex-direction:column;height:100%}
.chat .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;
  flex-direction:column;gap:10px}
.chat .msg{padding:10px 14px;border-radius:10px;max-width:78%;
  white-space:pre-wrap;line-height:1.5;font-size:13px}
.chat .msg.user{align-self:flex-end;background:#1f6feb;color:#fff}
.chat .msg.ai{align-self:flex-start;background:var(--bg2);color:var(--fg);
  border:1px solid var(--line)}
.chat .msg.err{border-color:var(--red);color:var(--red)}
.chat .hint{color:#484f58;font-style:italic;text-align:center;
  padding:32px 16px;font-size:12px}
.chat .input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat .input input{flex:1}
.md{padding:24px 32px;max-width:900px;line-height:1.7}
.md h1{font-size:20px;color:var(--blue);margin:24px 0 12px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.md h2{font-size:16px;color:#79c0ff;margin:20px 0 10px}
.md h3{font-size:13px;color:var(--purple);margin:16px 0 8px;
  text-transform:uppercase;letter-spacing:.5px}
.md code{background:var(--bg2);padding:2px 6px;border-radius:3px;
  color:#ffa657;font-family:ui-monospace}
.md pre{background:var(--bg2);padding:14px;border-radius:8px;
  overflow-x:auto;border:1px solid var(--line)}
.md pre code{background:none;padding:0;color:var(--fg)}
.md ul{padding-inline-start:24px}
.md li{margin:4px 0}
.md b{color:var(--fg)}
.dropzone{padding:14px;border:2px dashed var(--line);border-radius:8px;
  text-align:center;cursor:pointer;transition:.2s;
  color:var(--dim);font-size:12px}
.dropzone:hover,.dropzone.over{border-color:var(--blue);color:var(--blue);
  background:#0a1929}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:20px;background:var(--bg2);
  border:1px solid var(--line);border-radius:6px;padding:10px 16px;
  font-size:12px;z-index:100;animation:sl .2s ease-out}
.toast.ok{border-color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
@keyframes sl{from{transform:translateY(20px);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// ============================================================
// CONFIG — غيّر عنوان الباكند هنا
// ============================================================
const API_BASE = window.__API_BASE__ || "";  // فارغ = نفس النطاق
const WS_BASE  = window.__WS_BASE__  || "";  // مثال: "wss://api.example.com"

// ============================================================
// UTILS
// ============================================================
const $ = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") el.innerHTML = v;
    else el[k] = v;
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
};
const apiKey = () => localStorage.getItem("k") || "";
const setApiKey = (k) => localStorage.setItem("k", k);

async function api(path, init = {}) {
  const r = await fetch(API_BASE + path, {
    ...init,
    headers: { "X-API-Key": apiKey(), ...(init.headers || {}) },
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 200)}`);
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r.text();
}

function toast(text, kind = "ok") {
  const t = $( "div", { class: "toast " + kind }, text );
  document.body.append(t);
  setTimeout(() => t.remove(), 3000);
}

const fmt = {
  kb: (n) => (n / 1024).toFixed(1) + " KB",
  n: (n) => n.toLocaleString("en"),
  ago: (iso) => {
    const d = (Date.now() - new Date(iso).getTime()) / 1000;
    if (d < 60) return Math.floor(d) + "ث";
    if (d < 3600) return Math.floor(d / 60) + "د";
    if (d < 86400) return Math.floor(d / 3600) + "س";
    return Math.floor(d / 86400) + "ي";
  },
};

// ============================================================
// MARKDOWN — مبسّط بلا مكتبات
// ============================================================
function md(text) {
  let h = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, _l, c) => `<pre><code>${c}</code></pre>`);
  h = h.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  h = h.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  h = h.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/^\s*[-*] (.*)$/gm, "<li>$1</li>");
  h = h.replace(/(<li>[\s\S]*?<\/li>)/g, "<ul>$1</ul>");
  h = h.split(/\n\n+/).map(p =>
    /^<(h\d|pre|ul)/.test(p.trim()) ? p : `<p>${p.replace(/\n/g, "<br/>")}</p>`
  ).join("\n");
  return h;
}

// ============================================================
// STATE
// ============================================================
const S = {
  jobs: [],
  selected: null,
  tab: "analysis",
  jobLive: {},
  source: null,
  analysis: null,
  report: null,
  chat: [],
  chatBusy: false,
  uploadBusy: false,
  uploadErr: null,
};

const listeners = new Set();
const render = () => listeners.forEach(fn => fn());
const onRender = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };

// ============================================================
// API WRAPPERS
// ============================================================
const API = {
  async list() { return api("/api/jobs"); },
  async get(id) { return api("/api/jobs/" + id); },
  async source(id) {
    const r = await fetch(`${API_BASE}/api/jobs/${id}/source?k=${encodeURIComponent(apiKey())}`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  },
  async report(id) {
    const r = await fetch(`${API_BASE}/api/jobs/${id}/report?k=${encodeURIComponent(apiKey())}`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  },
  async analysis(id) { return api(`/api/jobs/${id}/analysis`); },
  async chat(id, q) {
    const r = await api(`/api/jobs/${id}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q }),
    });
    return r.answer;
  },
  downloadUrl(id) {
    return `${API_BASE}/api/jobs/${id}/source/download?k=${encodeURIComponent(apiKey())}`;
  },
  async upload(file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", API_BASE + "/api/upload");
      xhr.setRequestHeader("X-API-Key", apiKey());
      xhr.upload.onprogress = (e) => onProgress && onProgress(e.loaded / e.total);
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
        else reject(new Error("HTTP " + xhr.status + ": " + xhr.responseText.slice(0, 200)));
      };
      xhr.onerror = () => reject(new Error("network error"));
      const fd = new FormData();
      fd.append("file", file);
      xhr.send(fd);
    });
  },
};

// ============================================================
// POLLING + WEBSOCKET
// ============================================================
let ws = null;
function subscribe(id) {
  if (ws) { try { ws.close(); } catch {} ws = null; }
  const base = WS_BASE || `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}`;
  try {
    ws = new WebSocket(`${base}/ws/jobs/${id}`);
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        S.jobLive = { ...S.jobLive, ...msg };
        render();
        if (msg.status === "done" || msg.status === "failed") {
          refreshJobs();
          try { ws.close(); } catch {}
        }
      } catch {}
    };
    ws.onerror = () => {};
  } catch {}
}

async function refreshJobs() {
  try { S.jobs = await API.list(); render(); } catch {}
}

setInterval(() => {
  if (!S.selected) return;
  const j = S.jobs.find(x => x.id === S.selected);
  if (j && (j.status === "queued" || j.status === "running")) refreshJobs();
}, 4000);
setInterval(refreshJobs, 8000);

// ============================================================
// COMPONENTS
// ============================================================
function Header() {
  const input = $("input", { placeholder: "API key", value: apiKey() });
  return $("header", {},
    $("h1", {}, "مفكك Luraph AI"),
    $("div", { class: "key" },
      input,
      $("button", { onClick: () => { setApiKey(input.value); toast("تم الحفظ"); refreshJobs(); } }, "حفظ"),
    ),
  );
}

function UploadZone() {
  const fileInput = $("input", { type: "file", accept: ".lua,.luau,.txt",
    style: { display: "none" },
    onChange: (e) => { const f = e.target.files?.[0]; if (f) doUpload(f); } });
  const zone = $("div", { class: "dropzone", onClick: () => fileInput.click() },
    S.uploadBusy ? "جاري الرفع..." : "اسحب ملف .lua هنا أو اضغط للاختيار");

  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault(); zone.classList.remove("over");
    const f = e.dataTransfer.files[0]; if (f) doUpload(f);
  });

  async function doUpload(file) {
    if (!file.name.match(/\.(lua|luau|txt)$/i)) {
      toast("نوع الملف غير مدعوم", "err"); return;
    }
    S.uploadBusy = true; S.uploadErr = null; render();
    try {
      const r = await API.upload(file);
      S.selected = r.id; S.tab = "analysis";
      S.jobLive = {}; S.source = null; S.analysis = null; S.report = null;
      S.chat = [];
      subscribe(r.id);
      refreshJobs();
      toast("بدأ التحليل");
    } catch (e) {
      S.uploadErr = e.message;
      toast("فشل الرفع: " + e.message, "err");
    } finally {
      S.uploadBusy = false; render();
    }
  }

  return $("div", { class: "up" }, fileInput, zone,
    S.uploadErr ? $("div", { class: "err" }, S.uploadErr) : null);
}

function JobRow(j) {
  const cls = ["job"]; if (j.id === S.selected) cls.push("sel");
  return $("div", { class: cls.join(" "), onClick: () => selectJob(j.id) },
    $("div", { class: "name", title: j.input_name }, j.input_name),
    $("div", { class: "meta" },
      $("span", { class: "badge " + j.status }, j.status),
      $("span", {}, j.stage || ""),
      $("span", {}, j.progress + "%"),
      $("span", {}, fmt.ago(j.created_at)),
    ),
  );
}

function Sidebar() {
  return $("aside", {},
    UploadZone(),
    $("div", { class: "list" },
      S.jobs.length === 0
        ? $("div", { class: "empty" }, "لا توجد ملفات بعد")
        : S.jobs.map(JobRow),
    ),
  );
}

function ProgressView(job) {
  const m = { ...job, ...S.jobLive };
  return $("div", { class: "progress-wrap" },
    $("h2", {}, m.status === "failed" ? "فشل" : "جاري المعالجة..."),
    $("div", { class: "bar" }, $("i", { style: { width: (m.progress || 0) + "%" } })),
    $("div", { class: "stage" }, `${m.stage || "..."} — ${m.progress || 0}%`),
    m.error ? $("pre", { class: "err" }, m.error) : null,
  );
}

function CodeView() {
  if (S.source === null) {
    return $("div", { class: "empty" }, "جاري التحميل...");
  }
  if (typeof S.source === "string" && S.source.startsWith("error:")) {
    return $("div", { class: "err", style: { padding: "16px" } }, S.source);
  }
  const lines = S.source.split("\n");
  const nums = lines.map((_, i) => i + 1).join("\n");
  return $("div", { class: "code" },
    $("div", { class: "ln" }, nums),
    $("div", { class: "src" }, S.source),
  );
}

function AnalysisView() {
  if (S.analysis === null) return $("div", { class: "empty" }, "جاري التحميل...");
  const a = S.analysis;
  if (typeof a === "string") return $("div", { class: "err", style: { padding: 16 } }, a);

  const section = (title, items, color) => {
    if (!items || items.length === 0) return null;
    return $("div", { class: "sec" },
      $("h3", { style: color ? { color } : {} }, `${title} (${items.length})`),
      $("table", {}, $("tbody", {},
        items.slice(0, 300).map(x =>
          $("tr", {},
            $("td", {}, typeof x === "string" ? x : (x.name || JSON.stringify(x))),
            $("td", {}, typeof x === "object" ? (x.value || x.why || "") : ""),
          )),
      )),
    );
  };

  return $("div", {},
    $("div", { class: "stats" },
      $("div", {}, $("b", {}, fmt.kb(a.size_bytes)), " حجم"),
      $("div", {}, $("b", {}, fmt.n(a.lines)), " سطر"),
      $("div", {}, $("b", { style: { color: a.flag_count > 0 ? "var(--red)" : "var(--green)" } }, a.flag_count), " علامة"),
      $("div", {}, $("b", {}, (a.urls || []).length), " رابط"),
      $("div", {}, $("b", {}, (a.ips || []).length), " IP"),
      $("div", {}, $("b", {}, (a.webhooks || []).length), " Webhook"),
    ),
    section("رموز مشبوهة", a.flags, "var(--red)"),
    section("روابط", a.urls),
    section("Webhooks", a.webhooks, "var(--red)"),
    section("نطاقات", a.domains),
    section("عناوين IP", a.ips),
    section("أسرار محتملة", a.secrets, "#f0883e"),
  );
}

function ReportView() {
  if (S.report === null) return $("div", { class: "empty" }, "جاري التحميل...");
  if (typeof S.report === "string" && S.report.startsWith("error:")) {
    return $("div", { class: "err", style: { padding: 16 } }, S.report);
  }
  return $("div", { class: "md", html: md(S.report) });
}

function ChatView() {
  const msgs = $("div", { class: "msgs" },
    S.chat.length === 0 && !S.chatBusy
      ? $("div", { class: "hint" },
          "اسأل أي شي عن السكربت — «وش يسوي؟» «وين يرسل البيانات؟» «فيه أنتي-دِبَج؟»")
      : null,
    ...S.chat.map(m =>
      $("div", { class: "msg " + m.role + (m.err ? " err" : "") }, m.text)
    ),
    S.chatBusy ? $("div", { class: "msg ai" }, $("span", { class: "spin" }, "◐"), " يكتب...") : null,
  );

  const input = $("input", { placeholder: "اكتب سؤالك..." });
  const send = async () => {
    const q = input.value.trim();
    if (!q || S.chatBusy) return;
    input.value = "";
    S.chat.push({ role: "user", text: q });
    S.chatBusy = true; render();
    try {
      const a = await API.chat(S.selected, q);
      S.chat.push({ role: "ai", text: a });
    } catch (e) {
      S.chat.push({ role: "ai", text: "خطأ: " + e.message, err: true });
    } finally {
      S.chatBusy = false; render();
    }
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

  return $("div", { class: "chat" }, msgs,
    $("div", { class: "input" }, input,
      $("button", { class: "primary", onClick: send, disabled: S.chatBusy }, "إرسال")));
}

function JobView(job) {
  const m = { ...job, ...S.jobLive };
  if (m.status !== "done") return ProgressView(m);

  const tabs = ["analysis", "source", "report", "chat"];
  const labels = { analysis: "تحليل", source: "الكود", report: "تقرير AI", chat: "محادثة" };

  return $("section", { class: "view" },
    $("div", { class: "tabs" },
      ...tabs.map(t =>
        $("div", { class: "tab" + (S.tab === t ? " on" : ""), onClick: () => setTab(t) }, labels[t])
      ),
      $("div", { style: { flex: 1 } }),
      $("a", { href: API.downloadUrl(job.id), class: "tab", download: true },
        "⬇ تحميل الكود"),
    ),
    $("div", { class: "pane" },
      S.tab === "analysis" ? AnalysisView() :
      S.tab === "source"   ? CodeView() :
      S.tab === "report"   ? ReportView() :
      S.tab === "chat"     ? ChatView() : null
    ),
  );
}

function EmptyView() {
  return $("section", { class: "view" },
    $("div", { class: "empty" }, "ارفع ملف لكي يبدأ التحليل"));
}

// ============================================================
// ACTIONS
// ============================================================
async function selectJob(id) {
  S.selected = id; S.tab = "analysis";
  S.jobLive = {}; S.source = null; S.analysis = null; S.report = null; S.chat = [];
  render();

  const job = S.jobs.find(j => j.id === id);
  if (!job) return;

  if (job.status !== "done") { subscribe(id); return; }

  try { S.analysis = await API.analysis(id); } catch (e) { S.analysis = "error: " + e.message; }
  render();
  try { S.source = await API.source(id); } catch (e) { S.source = "error: " + e.message; }
  render();
  try { S.report = await API.report(id); } catch (e) { S.report = "error: " + e.message; }
  render();
}

function setTab(t) { S.tab = t; render(); }

// ============================================================
// RENDER LOOP
// ============================================================
function App() {
  const root = document.getElementById("app");
  const job = S.jobs.find(j => j.id === S.selected) || null;
  root.innerHTML = "";
  root.append(
    Header(),
    $("main", {},
      job ? JobView(job) : EmptyView(),
      Sidebar(),
    ),
  );
}
onRender(App);
App();
refreshJobs();
</script>
</body>
</html>
